{% extends "base.html" %}

{% block title %}500 – Internal Server Error{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <i class="bi bi-cone-striped text-warning display-1 mb-3"></i>
        <h1 class="fw-bold">500 - Application Error</h1>
        <p class="text-muted lead">An internal system error occurred while processing your request.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 py-2 mt-3">
            <i class="bi bi-arrow-clockwise me-2"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
