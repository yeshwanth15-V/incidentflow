{% extends "base.html" %}

{% block title %}404 – Page Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <i class="bi bi-exclamation-octagon text-danger display-1 mb-3"></i>
        <h1 class="fw-bold">404 - Page Not Found</h1>
        <p class="text-muted lead">The requested incident or page does not exist or has been removed.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 py-2 mt-3">
            <i class="bi bi-house me-2"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
